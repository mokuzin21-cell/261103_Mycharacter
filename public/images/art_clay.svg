<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <radialGradient id="clayBall" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#FED7AA"/>
      <stop offset="60%" stop-color="#FB923C"/>
      <stop offset="100%" stop-color="#C2410C"/>
    </radialGradient>
    <radialGradient id="clayHair" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#93C5FD"/>
      <stop offset="60%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </radialGradient>
    <filter id="clayShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>
  <rect width="200" height="200" rx="24" fill="#EFF6FF"/>
  <!-- 3D Clay dough character -->
  <circle cx="100" cy="155" r="32" fill="url(#clayHair)" filter="url(#clayShadow)"/>
  <circle cx="100" cy="90" r="42" fill="url(#clayBall)" filter="url(#clayShadow)"/>
  <!-- Hair clump clay blob -->
  <path d="M60 85 C55 52 75 42 100 42 C125 42 145 52 140 85 C128 72 118 64 100 64 C82 64 72 72 60 85 Z" fill="url(#clayHair)"/>
  <!-- Clay bead eyes -->
  <circle cx="85" cy="94" r="5" fill="#1E293B"/>
  <circle cx="83.5" cy="92.5" r="1.5" fill="#FFFFFF"/>
  <circle cx="115" cy="94" r="5" fill="#1E293B"/>
  <circle cx="113.5" cy="92.5" r="1.5" fill="#FFFFFF"/>
  <!-- Little nose ball -->
  <circle cx="100" cy="98" r="4" fill="#EA580C"/>
  <path d="M96 108 Q100 112 104 108" stroke="#9A3412" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="100" y="185" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1D4ED8" text-anchor="middle">3D CLAY</text>
</svg>
